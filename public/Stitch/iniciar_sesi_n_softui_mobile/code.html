<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center px-gutter py-xl">
<!-- Login Container -->
<div class="w-full max-w-md flex flex-col items-center">
<!-- Brand Logo Area -->
<div class="mb-xl flex flex-col items-center">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center mb-md soft-shadow">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" data-icon="calendar_today">calendar_today</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tight">AgendaPro</h1>
</div>
<!-- Card Section -->
<div class="w-full bg-surface-container-lowest rounded-[16px] p-xl soft-shadow">
<header class="mb-xl text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Sign In</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Manage your appointments with ease.</p>
</header>
<!-- Social Login -->
<button class="w-full h-12 flex items-center justify-center gap-sm bg-surface-container-lowest border border-outline-variant rounded-lg font-label-bold text-label-bold text-on-surface-variant soft-shadow-hover transition-all duration-200 active:scale-[0.98]">
<img alt="Google logo" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDBEeZGb0OG618Mk1Rr7SQ1SG_iEDvMM_MWrpiaFYKn-l6YWRUQPs1_6K9iSshkAKunNnqgVnAGaP_k1RYr3bkgEv8U151yZg1r1JAgmbkiurqpqDkGH9qiMKX2gZFDg8H5fprIua2-G9V9aVryP_2D33bjilWxhkk7_oau9iDVuewjqvC_hkR_PJwSM_Xzr96MnMhnmUWZU7-bcMtXuYhXT2m1JEE2hD0btYlzUY7sexdUujSjNRFOufRZyaiBiIHmm7pPdvQquH8X"/>
                Continue with Google
            </button>
<!-- Divider -->
<div class="relative flex py-xl items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-md text-caption font-caption text-outline-variant uppercase tracking-wider">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="username">Username</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all duration-200" id="username" placeholder="john.doe" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="password">Password</label>
<div class="relative">
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end mt-sm">
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<button class="w-full h-12 primary-gradient text-on-primary font-label-bold text-label-bold rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 active:scale-95 flex items-center justify-center" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Footer Section -->
<footer class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-bold text-label-bold text-primary ml-xs hover:underline" href="#">Sign up</a>
</p>
</footer>
</div>
<!-- Background Decoration (Optional for SoftUI depth) -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed-dim/10 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-fixed/10 blur-[120px] rounded-full -z-10"></div>
