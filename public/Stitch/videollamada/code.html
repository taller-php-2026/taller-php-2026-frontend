<script>
    // Mute and Video Toggles
    const muteBtn = document.getElementById('mute-btn');
    const videoBtn = document.getElementById('video-btn');

    muteBtn.addEventListener('click', () => {
        const icon = muteBtn.querySelector('.material-symbols-outlined');
        const isMuted = icon.innerText === 'mic_off';
        icon.innerText = isMuted ? 'mic' : 'mic_off';
        muteBtn.classList.toggle('bg-error', !isMuted);
        muteBtn.classList.toggle('text-on-error', !isMuted);
    });

    videoBtn.addEventListener('click', () => {
        const icon = videoBtn.querySelector('.material-symbols-outlined');
        const isOff = icon.innerText === 'videocam_off';
        icon.innerText = isOff ? 'videocam' : 'videocam_off';
        videoBtn.classList.toggle('bg-error', !isOff);
        videoBtn.classList.toggle('text-on-error', !isOff);
    });

    // Dynamic timer
    let timeLeft = 14*60 + 52;
    const totalTime = 20*60;
    const timerEl = document.getElementById('timer');
    const progressEl = document.getElementById('progress-bar');

    setInterval(() => {
        if(timeLeft > 0) {
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerEl.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
            
            const progressPercent = (timeLeft / totalTime) * 100;
            progressEl.style.width = `${progressPercent}%`;
        }
    }, 1000);

    // Active speaker simulation
    setInterval(() => {
        const mainVideo = document.querySelector('img[alt*="specialist"]');
        mainVideo.classList.toggle('active-speaker-ring');
    }, 5000);
</script>
