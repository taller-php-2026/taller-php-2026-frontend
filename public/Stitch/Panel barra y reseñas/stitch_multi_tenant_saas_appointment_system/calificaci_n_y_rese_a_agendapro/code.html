<script>
        let currentRating = 0;
        const labels = ["", "Muy Pobre", "Regular", "Bueno", "Muy Bueno", "Excelente"];

        function setRating(rating) {
            currentRating = rating;
            const stars = document.querySelectorAll('.star-icon');
            const label = document.getElementById('rating-label');
            
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.style.fontVariationSettings = "'FILL' 1";
                    star.classList.add('text-primary');
                    star.classList.remove('text-outline');
                } else {
                    star.style.fontVariationSettings = "'FILL' 0";
                    star.classList.remove('text-primary');
                    star.classList.add('text-outline');
                }
            });
            
            label.textContent = labels[rating];
            label.classList.add('animate-pulse');
            setTimeout(() => label.classList.remove('animate-pulse'), 500);
        }

        function updateCount() {
            const textarea = document.getElementById('review');
            const counter = document.getElementById('char-count');
            counter.textContent = `${textarea.value.length}/250`;
            
            if (textarea.value.length >= 250) {
                counter.classList.add('text-error');
            } else {
                counter.classList.remove('text-error');
            }
        }

        // Initialize with default hover effects logic if needed
    </script>
