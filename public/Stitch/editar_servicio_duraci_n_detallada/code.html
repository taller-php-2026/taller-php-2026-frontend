<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "surface-tint": "#006a61",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#5e6367",
                        "tertiary-container": "#baad3e",
                        "tertiary": "#695f00",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#c3c7cb",
                        "on-primary-fixed": "#00201d",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "surface-container-high": "#dce9ff",
                        "outline": "#6d7a77",
                        "tertiary-fixed-dim": "#d7c957",
                        "secondary-container": "#dce0e4",
                        "on-secondary-fixed-variant": "#43474b",
                        "surface": "#f8f9ff",
                        "on-primary-fixed-variant": "#005049",
                        "surface-container-low": "#eff4ff",
                        "secondary": "#5a5f62",
                        "error": "#ba1a1a",
                        "surface-variant": "#d3e4fe",
                        "primary-container": "#008378",
                        "on-tertiary-fixed-variant": "#4f4800",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed": "#171c1f",
                        "inverse-primary": "#6bd8cb",
                        "on-background": "#0b1c30",
                        "surface-bright": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#f4fffc",
                        "primary-fixed-dim": "#6bd8cb",
                        "primary-fixed": "#89f5e7",
                        "on-surface-variant": "#3d4947",
                        "on-tertiary-container": "#474000",
                        "surface-dim": "#cbdbf5",
                        "on-surface": "#0b1c30",
                        "on-tertiary-fixed": "#201c00",
                        "inverse-surface": "#213145",
                        "surface-container-highest": "#d3e4fe",
                        "outline-variant": "#bcc9c6",
                        "secondary-fixed": "#dfe3e7",
                        "primary": "#00685f",
                        "background": "#f8f9ff",
                        "tertiary-fixed": "#f4e570"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px",
                        "unit": "4px",
                        "gutter": "16px",
                        "container-padding": "24px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-bold": ["Inter"],
                        "caption": ["Inter"],
                        "body-sm": ["Inter"],
                        "title-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "caption": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "title-sm": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
        .soft-shadow { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04); }
        .soft-shadow-hover:hover { box-shadow: 0px 6px 24px rgba(0, 0, 0, 0.06); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col">
<!-- Top AppBar -->
<header class="bg-surface sticky top-0 z-50 px-gutter py-4 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-start text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Editar Servicio</h1>
</header>
<main class="flex-grow px-gutter pb-32">
<!-- Service Photo Section -->
<div class="flex flex-col items-center mt-8 mb-10">
<div class="relative">
<div class="w-32 h-32 rounded-xl overflow-hidden border-4 border-surface-container-lowest soft-shadow">
<img alt="Service Photo" class="w-full h-full object-cover" data-alt="A high-quality image of a modern haircut being performed in a professional salon. Soft focus background with professional lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEspn20-vaUjouNvQfQDskzF3tBzSvh7u5f0woZSjfJLp9fwt8_P0ichHg2FPxOlrzQhoxjiXGDLD68fCrDEiNovNdAH_18Z7IGE7de3U3UEKFjKMh9-P5ko-mEF4DxeQpqPXGnjulAq1Ffl2166G-0x9mWDrT6QJ348cxhenjh6_pUcjy9FzXO3tCjAyYjK5W2DITfdKI6tY1BCtHXIm-WfKY_e0hEo0w_wyu9a6tE4GyrhqzSulTrKVL-MB7lkGuoE72BFbQujbi"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center soft-shadow border-2 border-surface transition-transform active:scale-95">
<span class="material-symbols-outlined text-md">photo_camera</span>
</button>
</div>
<p class="mt-4 font-label-bold text-label-bold text-primary">Change Photo</p>
</div>
<!-- Form Fields -->
<div class="space-y-6 max-w-md mx-auto">
<!-- Service Name -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-1">Service Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md" type="text" value="Corte de Cabello"/>
</div>
<!-- Category Multi-select Tag System -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-1">Category</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md appearance-none">
<option disabled="" selected="" value="">Selecciona categorías...</option>
<option>Barbería</option>
<option>Peluquería</option>
<option>Tratamientos</option>
<option>Estética</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
<!-- Tags Container -->
<div class="flex flex-wrap gap-2 pt-2">
<div class="inline-flex items-center gap-1.5 bg-[#0e9488] text-white px-3 py-1.5 rounded-full soft-shadow text-caption font-label-bold">
<span>Barbería</span>
<button class="w-4 h-4 flex items-center justify-center rounded-full hover:bg-black/10 transition-colors">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
<div class="inline-flex items-center gap-1.5 bg-[#0e9488] text-white px-3 py-1.5 rounded-full soft-shadow text-caption font-label-bold">
<span>Tratamientos</span>
<button class="w-4 h-4 flex items-center justify-center rounded-full hover:bg-black/10 transition-colors">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<!-- Duration -->
<div class="space-y-2 col-span-1">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-1">Duration</label>
<div class="flex gap-2">
<div class="relative flex-1">
<select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg pl-3 pr-8 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md appearance-none">
<option>0</option>
<option selected="">1</option>
<option>2</option>
<option>3</option>
</select>
<span class="absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[10px] font-bold pointer-events-none">H</span>
</div>
<div class="relative flex-1">
<select class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg pl-3 pr-8 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md appearance-none">
<option>00</option>
<option>15</option>
<option>30</option>
<option selected="">45</option>
</select>
<span class="absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[10px] font-bold pointer-events-none">M</span>
</div>
</div>
</div>
<!-- Price -->
<div class="space-y-2 col-span-1">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-1">Price</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg pl-8 pr-4 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md" type="number" value="25.00"/>
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md">€</span>
</div>
</div>
</div>
<!-- Description -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface-variant block ml-1">Description</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-4 py-3 soft-shadow focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-body-md resize-none" rows="4">Incluye lavado con champú premium, corte personalizado y peinado final con productos de alta gama.</textarea>
</div>
<!-- Availability Toggle -->
<div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between border border-outline-variant/20">
<div>
<h3 class="font-label-bold text-label-bold text-on-surface">Servicio Activo</h3>
<p class="font-caption text-caption text-on-surface-variant">Disponible para reservas online</p>
</div>
<button class="w-12 h-6 bg-primary rounded-full relative flex items-center transition-colors">
<div class="w-4 h-4 bg-white rounded-full absolute right-1 shadow-sm"></div>
</button>
</div>
<!-- Actions Container -->
<div class="pt-8 space-y-4">
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-4 rounded-lg flex items-center justify-center gap-2 soft-shadow hover:opacity-90 transition-all active:scale-95">
<span class="material-symbols-outlined">save</span>
                Guardar Cambios
            </button>
<button class="w-full bg-transparent text-on-surface border border-outline-variant/50 font-label-bold text-label-bold py-4 rounded-lg flex items-center justify-center transition-all hover:bg-surface-variant/20 active:scale-95">
                Cancelar
            </button>
<div class="pt-4 border-t border-outline-variant/20">
<button class="w-full bg-transparent text-error border border-error/30 font-label-bold text-label-bold py-4 rounded-lg flex items-center justify-center gap-2 transition-all hover:bg-error-container/20 active:scale-95">
<span class="material-symbols-outlined">delete</span>
                    Eliminar Servicio
                </button>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant/10 px-gutter py-3 z-50">
<div class="flex items-center justify-between max-w-md mx-auto">
<a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<span class="text-[10px] font-medium">Agenda</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<div class="bg-primary-container/20 rounded-full px-4 py-1 flex flex-col items-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="text-[10px] font-bold">Servicios</span>
</div>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="text-[10px] font-medium">Ajustes</span>
</a>
</div>
</nav>
</body></html>
