<!-- Top AppBar (Mobile Style) -->
<header class="w-full sticky top-0 bg-surface z-40 shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<div class="flex items-center justify-between px-lg py-md w-full max-w-7xl mx-auto">
<div class="flex items-center gap-md">

</div>

</div>
</header>
<main class="max-w-md mx-auto px-lg pb-xl pt-lg">
<!-- Profile Picture Section -->
<div class="flex flex-col items-center mb-xl">
<div class="relative">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-lowest soft-shadow">
<img alt="Julian Rivera" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBX4O3HBzDG1jOEEM2qdEbpDLoeZqVRxev0gFqblCkad2tdfOr-Jm3wryr2qxRLiE3y9csuGhrb6q7U0Svj7jvEMUXRrkHQw4b1LFM6vdaxWJJn5_s_tJ1UTOoi7G5p8wIl7tIT_FWkKpLGpBmB5AC7lM7V5CfJWBOpcroJWqmg9aaYeoaZhyH5RNfzDseKVuWR_J1Xi2f9kdwijg5xC24E6xACbbKSWq0My9vowhEIwSSlAP0PExS-YcLzDCsicEgfGjeXl1JxRDxh">
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center border-2 border-surface shadow-md hover:opacity-90 active:scale-90 transition-all">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
</button>
</div>
<p class="mt-sm font-label-bold text-label-bold text-on-surface-variant">Cambiar Foto de Perfil</p>
</div>
<!-- Form Section -->
<div class="space-y-lg">
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-md soft-shadow border border-outline-variant/10">
<div class="space-y-md">
<!-- Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-primary">Nombre Completo</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md" type="text" value="Julian Rivera">
</div>
<!-- Specialty Select -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-primary">Especialidad / Cargo</label>
<div class="relative">
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md appearance-none">
<option disabled="" selected="" value="">Seleccionar especialidad...</option>
<option value="barber">Master Barber</option>
<option value="hairdresser">Peluquero</option>
<option value="stylist">Estilista</option>
<option value="colorist">Colorista</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
<!-- Selected Specialties Chips -->
<div class="flex flex-wrap gap-sm mt-sm">
<div class="inline-flex items-center gap-xs px-sm py-1 bg-primary/10 text-primary rounded-lg border border-primary/20">
<span class="text-label-bold">Master Barber</span>
<button class="flex items-center justify-center hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<div class="inline-flex items-center gap-xs px-sm py-1 bg-primary/10 text-primary rounded-lg border border-primary/20">
<span class="text-label-bold">Diseño de Barba</span>
<button class="flex items-center justify-center hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</div>
<!-- Biography TextArea -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-primary">Biografía breve</label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md resize-none" rows="4">Experto en técnicas de corte clásico y moderno con más de 10 años de trayectoria. Especialista en diseño de barba y cuidado capilar avanzado.</textarea>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-primary">Correo Electrónico</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-on-surface-variant" type="email" value="julian.rivera@esteticapro.com">
</div>
<!-- Phone Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-primary">Teléfono</label>
<input class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all font-body-md text-on-surface-variant" type="tel" value="+34 612 345 678">
</div>
</div>
</div>
<!-- Availability Toggle Card -->
<div class="bg-surface-container-lowest rounded-xl p-md soft-shadow border border-outline-variant/10 flex items-center justify-between">
<div>
<p class="font-label-bold text-label-bold text-on-surface">Disponibilidad Activa</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Permitir reservas automáticas</p>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-12 h-6 bg-secondary-container peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md pt-md">
<button class="w-full bg-primary hover:bg-primary-container text-white font-label-bold py-md rounded-lg shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined text-[20px]">save</span>
<span class="">Guardar</span>
</button>
<div class="flex gap-md">
<button class="flex-1 bg-surface border border-outline-variant text-on-surface-variant font-label-bold py-md rounded-lg hover:bg-surface-variant/20 active:scale-95 transition-all">
                        Cancelar
                    </button>
<button class="flex-1 bg-error-container/20 text-error font-label-bold py-md rounded-lg hover:bg-error-container/40 active:scale-95 transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[18px]">delete</span>
                        Eliminar
                    </button>
</div>
</div>
</div>
</main>
<!-- Contextual Bottom Nav -->
<nav class="lg:hidden fixed bottom-0 w-full z-50 flex justify-around items-center px-md py-sm bg-surface-container-lowest shadow-[0px_-4px_20px_rgba(0,0,0,0.04)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-caption text-caption">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined">event</span>
<span class="font-caption text-caption">Calendar</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-primary-container/20 rounded-xl px-4 py-1 active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined">badge</span>
<span class="font-caption text-caption">Team</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary hover:opacity-80 active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined">settings_account_box</span>
<span class="font-caption text-caption">Settings</span>
</a>
</nav>

<div class="h-24 lg:hidden"></div>
