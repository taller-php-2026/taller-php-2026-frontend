<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#009688",
                        "primary-container": "#008378",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "surface": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#3d4947",
                        "outline": "#6d7a77",
                        "outline-variant": "#bcc9c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "container-padding": "24px",
                        "gutter": "16px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "title-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "caption": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "body-sm": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "title-sm": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "caption": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-bold": ["14px", {"lineHeight": "1.2", "fontWeight": "600"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-shadow {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.04);
        }
        .primary-gradient {
            background: linear-gradient(180deg, #009688 0%, #00796b 100%);
        }
        body {
            min-height: 100dvh;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-lg py-md w-full sticky top-0 z-40 bg-surface shadow-sm">
<div class="flex items-center gap-md">
<button class="flex items-center justify-center p-xs rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Añadir Nuevo Servicio</h1>
</div>
<!-- Profile Image Removed per request -->
<div class="w-10"></div>
</header>
<main class="px-container-padding py-lg max-w-lg mx-auto pb-32">
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-2xl soft-shadow p-md space-y-lg border border-[#f1f5f9]">
<!-- Service Image Uploader -->
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant">Imagen del Servicio</label>
<div class="w-full h-40 rounded-xl border-2 border-dashed border-outline-variant bg-surface flex flex-col items-center justify-center gap-sm cursor-pointer hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-4xl text-outline">add_a_photo</span>
<span class="text-caption text-outline">Subir foto del servicio</span>
</div>
</div>
<!-- Service Name -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Nombre del Servicio</label>
<input class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md" placeholder="Ej. Corte de pelo premium" type="text"/>
</div>
<!-- Category Selector -->
<div class="space-y-xs mb-md">
<label class="font-label-bold text-label-bold text-on-surface-variant">Categoría</label>
<div class="relative">
<select class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none appearance-none text-body-md cursor-pointer">
<option disabled="" selected="" value="">Selecciona una categoría</option>
<option>Peluquería</option>
<option>Manicura</option>
<option>Masajes</option>
<option>Tratamientos Faciales</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div><div class="flex flex-wrap gap-sm mt-sm">
<!-- Sample Tag -->
<div class="flex items-center gap-xs bg-primary text-on-primary px-md py-1 rounded-full shadow-sm">
<span class="text-body-sm font-medium">Peluquería</span>
<button class="flex items-center justify-center hover:bg-white/20 rounded-full transition-colors">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
<div class="flex items-center gap-xs bg-primary text-on-primary px-md py-1 rounded-full shadow-sm">
<span class="text-body-sm font-medium">Manicura</span>
<button class="flex items-center justify-center hover:bg-white/20 rounded-full transition-colors">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</div>
<!-- Duration Picker - Updated to numeric inputs -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Duración</label>
<div class="grid grid-cols-2 gap-md">
<div class="relative">
<input class="w-full bg-surface border border-[#e2e8f0] rounded-lg pl-md pr-xl py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md" min="0" placeholder="0" type="number"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 text-caption text-outline">Horas</span>
</div>
<div class="relative">
<input class="w-full bg-surface border border-[#e2e8f0] rounded-lg pl-md pr-xl py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md" max="59" min="0" placeholder="30" type="number"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 text-caption text-outline">Min</span>
</div>
</div>
</div>
<!-- Price Input -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Precio</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant font-label-bold">$</span>
<input class="w-full bg-surface border border-[#e2e8f0] rounded-lg pl-xl pr-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<!-- Description Textarea -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant">Breve Descripción</label>
<textarea class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md resize-none" placeholder="Describe los detalles del servicio..." rows="4"></textarea>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-xl flex flex-col gap-md">
<button class="primary-gradient w-full py-md rounded-xl text-on-primary font-label-bold text-label-bold soft-shadow hover:opacity-90 transition-all active:scale-95">
                Guardar Servicio
            </button>
<button class="w-full py-md rounded-xl bg-surface border border-[#e2e8f0] text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-container-low transition-all active:scale-95">
                Cancelar
            </button>
</div>
<!-- Illustration Removed per request -->
</main>
</body></html>
