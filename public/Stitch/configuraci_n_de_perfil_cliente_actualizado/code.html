                    "surface-container-high": "#dce9ff",
                    "on-primary": "#ffffff",

                    "surface-container": "#e5eeff",

            "spacing": {
                    "md": "16px",
                    "xl": "32px",
                    "gutter": "16px",
                    "unit": "4px",
                    "lg": "24px",
                    "container-padding": "24px",
                    "sm": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "title-sm": ["Inter"],
                    "headline-md": ["Inter"],

            },

                    "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],

          },
        },
      }

<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9ff; }
        .soft-shadow { shadow-[0px_4px_20px_rgba(0,0,0,0.04)]; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen" data-mode="connect">
<!-- TopAppBar Shell -->
<header class="w-full top-0 sticky shadow-[0px_4px_20px_rgba(0,0,0,0.04)] bg-surface z-50">
<div class="flex items-center justify-between px-lg py-md w-full max-w-7xl mx-auto">
<div class="flex items-center gap-md">
<button class="active:scale-95 transition-transform duration-200 text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Configuración de Perfil</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary" data-icon="account_circle"><br></span>
</div>
</div>
</header>
<main class="max-w-md mx-auto px-lg mt-xl space-y-lg">
<!-- User Info Header Section -->
<section class="flex flex-col items-center justify-center p-lg bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<div class="relative group">
<img alt="Profile Picture" class="w-24 h-24 rounded-full object-cover border-4 border-surface-container" data-alt="A professional headshot of a smiling young woman with dark hair, captured in soft, natural morning light. The background is a clean, minimalist studio setting with soft pastel tones that match a modern SaaS aesthetic. The lighting is bright and airy, emphasizing a high-key, approachable professional brand identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBKFPIdwAwenLkQteMIQWDlbgG8uvhw5MMKIvA3_5bgEVxssOevl0oJGWDBLG0eYr65t0MRDoPYl2do2C6nINYsoFZpCxNlN0KLhl12DhYMXrK0WXLigcA1Sq5JCDDQ7FuSnp6T3iIHPNpQ1fyEXmhZmmfDpyEJMamYk1-3CwxRMG9hLcyllr9FeI1ZAjWAui9O26FbzB8lpqfUHP21I6ul-lioYyFOiQvzGEH_UpP92-x16wUUFUIhAdSRXr7HGKqwTnN1XrgWyuy">
<button class="absolute bottom-0 right-0 bg-primary p-xs rounded-full text-white shadow-lg active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</button>
</div>
<div class="mt-md text-center">
<h2 class="font-title-sm text-title-sm text-on-surface">Mariana Rodríguez</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant"><br></p>
</div>
</section>
<!-- Account Settings Form -->
<section class="space-y-md">
<div class="bg-surface-container-lowest p-md rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)]">
<h3 class="font-label-bold text-label-bold text-primary mb-md">Datos de la Cuenta</h3>
<div class="space-y-lg">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant px-xs">Correo Electrónico</label>
<div class="flex items-center bg-background border border-outline-variant rounded-lg px-md py-sm focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/15 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-md" data-icon="mail">mail</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-body-md focus:ring-0 text-on-surface" placeholder="ejemplo@correo.com" type="email" value="mariana.rod@example.com">
</div>
</div>
<!-- Phone Field -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant px-xs">Número de Teléfono</label>
<div class="flex items-center bg-background border border-outline-variant rounded-lg px-md py-sm focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/15 transition-all">
<span class="material-symbols-outlined text-on-surface-variant mr-md" data-icon="call">call</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-body-md focus:ring-0 text-on-surface" placeholder="Tu teléfono" type="tel" value="+52 55 1234 5678">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant px-xs">Contraseña</label>
<div class="flex items-center justify-between bg-background border border-outline-variant rounded-lg px-md py-sm focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/15 transition-all">
<div class="flex items-center flex-1">
<span class="material-symbols-outlined text-on-surface-variant mr-md" data-icon="lock">lock</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-body-md focus:ring-0 text-on-surface cursor-default" readonly="" type="password" value="••••••••••••">
</div>
<button class="text-primary font-label-bold text-label-bold active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="edit">edit</span>
</button>
</div>
</div><!-- Confirm Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-caption text-caption text-on-surface-variant px-xs">Confirmar Contraseña</label>
<div class="flex items-center justify-between bg-background border border-outline-variant rounded-lg px-md py-sm focus-within:border-primary focus-within:ring-4 focus-within:ring-primary/15 transition-all">
<div class="flex items-center flex-1">
<span class="material-symbols-outlined text-on-surface-variant mr-md" data-icon="lock">lock</span>
<input class="bg-transparent border-none p-0 w-full font-body-md text-body-md focus:ring-0 text-on-surface" placeholder="Repite tu contraseña" type="password" value="••••••••••••">
</div>
<button class="text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
</div>
</section>
<!-- Actions Section -->
<section class="flex flex-col gap-md pt-md">
<button class="w-full bg-primary text-white font-label-bold text-label-bold py-md rounded-lg shadow-lg active:scale-[0.98] transition-all bg-gradient-to-b from-primary to-[#005a52]">
                Guardar Cambios
            </button>
<button class="w-full flex items-center justify-center gap-sm text-error font-label-bold text-label-bold py-md active:opacity-70 transition-opacity">
<span class="material-symbols-outlined" data-icon="logout"><br></span></button>
</section>
</main>
<!-- BottomNavBar Shell -->


</body></html>
