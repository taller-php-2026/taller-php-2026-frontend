<body class="bg-background text-on-surface antialiased min-h-[884px] flex flex-col items-center" data-stitch-vh="min-h-[884px]===min-h-screen" data-mode="connect">
<!-- Top AppBar Integration -->
<header class="bg-surface docked full-width top-0 border-b border-outline-variant/20 flex justify-between items-center w-full px-margin py-4 max-w-container-max mx-auto z-50 sticky">
<div class="flex items-center gap-4">
<button aria-label="Back to Management" class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Añadir Profesional</h1>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle"><br></span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-gutter py-xl flex flex-col gap-xl">
<!-- Profile Picture Upload Section -->
<section class="flex flex-col items-center gap-md">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center soft-shadow overflow-hidden">
<span class="material-symbols-outlined text-outline text-5xl" data-icon="person">person</span>
</div>
<button aria-label="Upload Photo" class="absolute bottom-1 right-1 bg-primary text-on-primary p-2 rounded-full shadow-lg hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-md" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<p class="font-caption text-caption text-on-surface-variant">Sube una foto de perfil profesional</p>
</section>
<!-- Form Fields Section -->
<form class="flex flex-col gap-lg">
<!-- Input: Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="full_name">Nombre Completo</label>
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg soft-shadow soft-shadow-hover focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all outline-none font-body-md text-body-md" id="full_name" placeholder="Ej. Ana García" type="text">
</div>
<!-- Input: Specialty -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="specialty">Especialidad/Cargo</label>
<div class="flex flex-col gap-sm">
<div class="relative">
<select class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg soft-shadow soft-shadow-hover focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all outline-none font-body-md text-body-md appearance-none" id="specialty">
<option disabled="" selected="" value="">Selecciona una especialidad</option>
<option value="estilista-senior">Estilista Senior</option>
<option value="colorista">Colorista</option>
<option value="barbero">Barbero</option>
<option value="manicurista">Manicurista</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-outline-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
<div class="flex flex-wrap gap-xs mt-1" id="specialty-chips">
<div class="inline-flex items-center gap-xs px-3 py-1 bg-primary-fixed text-on-primary-fixed rounded-full text-caption border border-primary/10">
<span>Estilista Senior</span>
<button class="flex items-center justify-center hover:bg-on-primary-fixed/10 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>
<div class="inline-flex items-center gap-xs px-3 py-1 bg-primary-fixed text-on-primary-fixed rounded-full text-caption border border-primary/10">
<span>Colorista</span>
<button class="flex items-center justify-center hover:bg-on-primary-fixed/10 rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="close">close</span>
</button>
</div>
</div>
</div>
</div>
<!-- Input: Bio -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="bio">Biografía Breve</label>
<textarea class="w-full px-md py-sm bg-surface-container-lowest border border-outline-variant/30 rounded-lg soft-shadow soft-shadow-hover focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all outline-none font-body-md text-body-md resize-none" id="bio" placeholder="Describe brevemente la trayectoria del profesional..." rows="3"></textarea>
</div>
<!-- Input: Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="email">Correo Electrónico</label>
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg soft-shadow soft-shadow-hover focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all outline-none font-body-md text-body-md" id="email" placeholder="profesional@aura.com" type="email">
</div>
<!-- Input: Phone -->
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="phone">Número de Teléfono</label>
<input class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant/30 rounded-lg soft-shadow soft-shadow-hover focus:ring-2 focus:ring-primary/15 focus:border-primary transition-all outline-none font-body-md text-body-md" id="phone" placeholder="+34 000 000 000" type="tel">
</div>
<!-- Availability Toggle -->
<div class="flex items-center justify-between p-md bg-surface-container-low rounded-xl border border-outline-variant/10 soft-shadow">
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-on-surface">Activar Disponibilidad</span>
<span class="font-caption text-caption text-on-surface-variant">Permitir que los clientes reserven citas</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-secondary-container peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mt-lg">
<button class="w-full h-14 bg-primary text-on-primary font-label-bold text-label-bold rounded-lg shadow-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span class="material-symbols-outlined" data-icon="save">save</span>
                    Guardar</button>
<button class="w-full h-14 bg-surface-container-lowest text-on-surface-variant border border-outline-variant/50 font-label-bold text-label-bold rounded-lg hover:bg-surface-variant/20 transition-all flex items-center justify-center" type="button">
                    Cancelar
                </button>
</div>
</form>
</main>
<!-- Visual Polish: Soft Decorative Elements -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background to-transparent pointer-events-none"></div>
<!-- Background Illustration (Subtle) -->
<div class="fixed top-20 right-[-100px] w-64 h-64 bg-primary-fixed-dim/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed bottom-10 left-[-50px] w-48 h-48 bg-surface-dim/30 rounded-full blur-3xl -z-10"></div>
</body></html>
