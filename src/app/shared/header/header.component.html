<header class="w-full mx-auto flex justify-center py-4">
    <div class="flex justify-between items-center w-3/4 mx-auto">
        <a routerLink="/" class="flex gap-2 items-center cursor-pointer!">
            <ng-icon name="heroCalendarDays" size="40" />
            <div>
                <h1 class="text-2xl font-bold">AgendaPro</h1>
                <p class="text-gray-600 text-md">Sistema de reservas</p>
            </div>
        </a>

        @if (auth.isAuthenticated()) {
        <div class="flex items-center gap-3">
            <span class="font-semibold text-on-surface">{{ auth.currentUser()?.name }}</span>
            <button (click)="logout()"
                class="px-4 py-2 rounded-lg border border-error text-error text-sm font-semibold hover:bg-error hover:text-white transition-all">
                Cerrar sesión
            </button>
        </div>
        } @else {
        <a routerLink="/login" class="text-primary text-xl font-semibold hover:underline">
            Iniciar sesión
        </a>
        }
    </div>
</header>
