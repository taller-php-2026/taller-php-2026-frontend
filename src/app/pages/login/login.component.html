<div class="w-full max-w-md mx-auto flex flex-col items-center py-xl px-gutter mt-10">
  <!-- Card Section -->
  <div class="w-full bg-surface-container-lowest rounded-[16px] p-xl soft-shadow border border-outline-variant/20">
    <header class="mb-xl text-center">
      <h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Iniciar Sesión</h2>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Gestiona tus citas con facilidad.</p>
    </header>

    <!-- Google Sign-In -->
    <div class="w-full mb-md">
      <button
        type="button"
        (click)="loginWithGoogle()"
        class="w-full h-12 flex items-center justify-center gap-sm border border-outline-variant rounded-lg bg-surface-container-lowest hover:bg-surface-container transition-colors font-label-bold text-label-bold text-on-surface"
      >
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Acceder con Google
      </button>
    </div>

    <!-- Divider -->
    <div class="relative flex py-md items-center">
      <div class="flex-grow border-t border-outline-variant/30"></div>
      <span class="flex-shrink mx-md text-caption font-caption text-outline-variant uppercase tracking-wider">o</span>
      <div class="flex-grow border-t border-outline-variant/30"></div>
    </div>

    <!-- Error Message -->
    @if (errorMsg()) {
      <div class="p-sm bg-error-container text-on-error-container rounded-lg text-body-sm text-center mb-lg border border-error/20">
        {{ errorMsg() }}
      </div>
    }

    <!-- Login Form -->
    <form (submit)="onSubmit($event)" class="space-y-lg" novalidate>

      <!-- Email Input -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="email">Correo Electrónico</label>
        <div class="relative">
          <input
            class="w-full h-12 px-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all duration-200"
            id="email"
            placeholder="ejemplo&#64;correo.com"
            type="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            (blur)="touch('email')"
            name="email"
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant ml-xs" for="password">Contraseña</label>
        <div class="relative">
          <input
            class="w-full h-12 px-md pr-[44px] bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md focus:ring-2 focus:ring-primary/15 focus:border-primary outline-none transition-all duration-200"
            id="password"
            placeholder="••••••••"
            [type]="showPassword() ? 'text' : 'password'"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            (blur)="touch('password')"
            name="password"
            autocomplete="current-password"
          />
          <button
            class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-primary transition-colors flex items-center"
            type="button"
            (click)="togglePasswordVisibility()"
          >
            <span class="material-symbols-outlined select-none">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="flex justify-end">
        <a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Submit Button -->
      <button
        style="background: linear-gradient(180deg, #0e9488 0%, #005049 100%) !important; color: white !important;"
        class="w-full h-12 text-white font-label-bold text-label-bold rounded-lg shadow-lg hover:shadow-xl transition-all duration-200 active:scale-95 flex items-center justify-center disabled:opacity-50"
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="animate-spin mr-sm h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
          Iniciando...
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>
  </div>

  <!-- Footer Section -->
  <footer class="mt-xl text-center">
    <p class="font-body-sm text-body-sm text-on-surface-variant">
      ¿No tienes una cuenta?
      <a class="font-label-bold text-label-bold text-[#0e9488] ml-xs hover:underline" routerLink="/registro" href="/registro">Registrarse</a>
    </p>
  </footer>
</div>

<!-- Background Decoration -->
<div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-fixed-dim/10 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-fixed/10 blur-[120px] rounded-full -z-10"></div>
