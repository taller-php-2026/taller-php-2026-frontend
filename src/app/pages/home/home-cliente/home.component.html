<app-hero (onSearch)="handleSearch($event)" />

<app-layout>
    <div class="w-full flex flex-col space-y-2 mt-4">
        @if (services.length === 0) {
        <div class="flex flex-col items-center justify-center py-16 text-gray-500">
            <ng-icon name="heroMagnifyingGlass" size="48" />
            <p class="text-xl mt-4">No se encontraron resultados</p>
            <p class="text-sm mt-2">Intentá con otros términos de búsqueda</p>
        </div>
        } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            @for (service of services; track service.idServicio) {
            <app-service-card [service]="service" />
            }
        </div>
        }
    </div>
</app-layout>
