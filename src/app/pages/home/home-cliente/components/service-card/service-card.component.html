<a [routerLink]="['/servicio/' + service.idServicio + '/seleccionar-profesional']" class="flex w-full flex-col border border-gray-400 rounded-lg overflow-hidden space-y-2
          hover:border-primary transition-all duration-200 select-none no-underline
          cursor-pointer hover:shadow-sm active:scale-[0.99]">

    <img
      [src]="service.imagenUrl || 'assets/placeholders/service-placeholder.svg'"
      [alt]="service.nombre"
      class="w-full h-40 object-cover bg-gray-100"
      (error)="onImgError($event)"
    />

    <div class="flex flex-col p-4 space-y-2">
      <div class="flex justify-between items-start gap-2">
          <h3 class="text-lg font-semibold">{{ service.nombre }}</h3>
          <span class="text-xs px-2 py-1 rounded-md whitespace-nowrap" [ngClass]="{
      'bg-green-100 text-green-800': service.modalidad === 'presencial',
      'bg-blue-100 text-blue-800':  service.modalidad === 'virtual',
      'bg-yellow-100 text-yellow-800': service.modalidad === 'hibrida'
  }">
              {{ service.modalidad | uppercase }}
          </span>
      </div>

      <p class="text-gray-600">{{ service.descripcion }}</p>
      <div class="flex items-center justify-between">
          <p class="flex items-center gap-1">
              <ng-icon name="heroClock" class="text-blue-500 shrink-0"></ng-icon>
              {{ service.duracionMinutos }} min
          </p>
          <p class="text-primary font-semibold">${{ service.precio }}</p>
      </div>
    </div>

</a>
