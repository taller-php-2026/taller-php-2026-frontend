<article class="flex h-full w-full flex-col overflow-hidden rounded-xl border border-gray-100 bg-white shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-primary/40 hover:shadow-md">
    <a [routerLink]="['/servicio/' + service.idServicio + '/seleccionar-profesional']" class="block no-underline text-inherit">
        <div class="relative h-44 w-full bg-gray-100">
            @if (service.imagenUrl) {
            <img
                [src]="service.imagenUrl"
                [alt]="service.nombre"
                class="h-full w-full object-cover"
                (error)="onImgError($event)"
            />
            } @else {
            <div class="flex h-full w-full flex-col items-center justify-center gap-2 bg-gradient-to-br from-primary/10 to-sky-50 text-primary">
                <span class="material-symbols-outlined text-5xl">{{ getPlaceholderIcon() }}</span>
                <span class="text-sm font-semibold">{{ getModalidadLabel() }}</span>
            </div>
            }

            <span class="absolute left-3 top-3 rounded-full px-3 py-1 text-xs font-bold shadow-sm" [ngClass]="getModalidadClass()">
                {{ getModalidadLabel() }}
            </span>
        </div>
    </a>

    <div class="flex flex-1 flex-col p-4">
        <a [routerLink]="['/servicio/' + service.idServicio + '/seleccionar-profesional']" class="no-underline text-inherit">
            <h3 class="text-lg font-bold text-gray-900">{{ service.nombre }}</h3>
            <p class="mt-1 min-h-10 text-sm leading-5 text-gray-600">{{ getDescripcionCorta() }}</p>
        </a>

        <div class="mt-4 flex flex-wrap gap-2 text-sm text-gray-600">
            <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1">
                <ng-icon name="heroClock" class="text-primary shrink-0"></ng-icon>
                {{ service.duracionMinutos }} min
            </span>
            <span class="inline-flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1">
                <span class="material-symbols-outlined text-[18px] text-primary">{{ getPlaceholderIcon() }}</span>
                {{ getModalidadLabel() }}
            </span>
        </div>

        <div class="mt-auto flex items-center justify-between gap-3 pt-5">
            <div>
                <p class="text-xs font-semibold uppercase text-gray-500">Precio</p>
                <p class="text-2xl font-bold text-primary">${{ service.precio }}</p>
            </div>

            <a
                [routerLink]="['/servicio/' + service.idServicio + '/seleccionar-profesional']"
                class="rounded-lg bg-primary px-4 py-2 text-sm font-bold text-white no-underline transition-all hover:brightness-110 active:scale-95"
            >
                Reservar
            </a>
        </div>
    </div>
</article>
