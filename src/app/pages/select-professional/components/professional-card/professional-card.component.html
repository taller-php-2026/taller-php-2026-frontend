<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mt-4">
    @for (professional of professionals; track professional.id) {

    <div class="flex w-full justify-start border border-gray-400 rounded-lg p-4 space-x-2 cursor-pointer hover:border-primary transition-colors duration-300"
        [class.border-primary]="professional.id === selectedProfessionalId"
        [class.border-gray-400]="professional.id !== selectedProfessionalId"
        (click)="selectProfessional(professional.id)">

        <img src="https://img.magnific.com/foto-gratis/sonriente-joven-peluquero-masculino-caucasico-gafas-banda-pelo-ondulado-uniforme-sosteniendo-tijeras-peine-aislado-sobre-fondo-blanco-espacio-copia_141793-32060.jpg?semt=ais_hybrid&w=740&q=80"
            alt="{{ professional.name }}" class="w-24 h-24 rounded-full object-cover" />
        <div class="flex flex-col">
            <h3 class="text-lg font-semibold">{{ professional.name }}</h3>

            <p class="text-gray-600">{{ professional.specialty }}</p>

            <div class="flex items-center mt-2 justify-center ">
                <ng-icon name="heroStarSolid" class="text-primary text-xl" />
                <p class="text-lg font-bold text-primary mx-1"> {{
                    professional.rating.toFixed(1) }}</p>
                <p class="text-gray-600 ">({{ professional.reviews }} reseñas)</p>
            </div>
        </div>
    </div>
    }
</div>
