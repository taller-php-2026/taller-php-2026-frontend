<div class="flex w-full items-center gap-4 border border-gray-400 rounded-xl p-4 
            cursor-pointer hover:border-primary hover:shadow-sm 
            transition-all duration-200 active:scale-[0.99]" (click)="selectProfessional()"
    [class.border-primary]="isSelected" [class.shadow-sm]="isSelected">

    <img
        [src]="professional.usuario?.imagenPerfilUrl || 'assets/placeholders/user-placeholder.svg'"
        [alt]="professional.usuario?.nombre ?? professional.nombreNegocio ?? 'Profesional'"
        class="w-20 h-20 rounded-full object-cover shrink-0 border-2 border-gray-100"
        (error)="onImgError($event)"
    />

    <div class="flex flex-col flex-1 gap-1">
        <h3 class="text-base font-semibold text-gray-900">{{ professional.usuario?.nombre ?? professional.nombreNegocio }}</h3>
        <p class="text-sm text-gray-500 line-clamp-2">{{ professional.descripcion }}</p>
        <div class="flex items-center gap-1 mt-1">
            <ng-icon name="heroStarSolid" class="text-yellow-400 text-base shrink-0" />
            <span class="text-sm font-medium text-gray-700">{{ professional.ratingPromedio }}</span>
            <span class="text-sm text-black">/ 5</span>
        </div>
    </div>

    <ng-icon name="heroChevronRight" class="text-gray-300 shrink-0" />

</div>
