<header class="flex justify-between items-center px-lg py-md w-full sticky top-0 z-40 bg-surface-container-lowest shadow-sm">
  <div class="flex items-center gap-md">
    <button (click)="goBack()" class="flex items-center justify-center p-xs rounded-full hover:bg-surface-container-low transition-colors text-primary border border-transparent active:scale-95">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <h1 class="font-headline-md text-headline-md text-primary">Editar Servicio</h1>
  </div>
  <div class="w-10"></div>
</header>

<main class="px-container-padding py-lg max-w-lg mx-auto pb-32">
  <!-- Success/Error Feedback -->
  @if (successMsg()) {
    <div class="p-sm bg-green-50 text-green-700 rounded-lg text-body-sm text-center border border-green-200 mb-md">
      {{ successMsg() }}
    </div>
  }
  @if (errorMsg()) {
    <div class="p-sm bg-error-container text-on-error-container rounded-lg text-body-sm text-center border border-error/20 mb-md">
      {{ errorMsg() }}
    </div>
  }

  <!-- Form Card -->
  <div class="bg-surface-container-lowest rounded-2xl soft-shadow p-md space-y-lg border border-[#f1f5f9] shadow-xl">
    
    <!-- Service Image Uploader -->
    <div class="space-y-sm text-center flex flex-col items-center">
      <label class="font-label-bold text-label-bold text-on-surface-variant block w-full text-left">Imagen del Servicio</label>
      <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" class="hidden" />
      
      <div class="relative group">
        <div class="w-32 h-32 rounded-xl overflow-hidden border-4 border-surface-container-lowest soft-shadow">
          <img [src]="imagePreview() || 'https://lh3.googleusercontent.com/aida-public/AB6AXuCEspn20-vaUjouNvQfQDskzF3tBzSvh7u5f0woZSjfJLp9fwt8_P0ichHg2FPxOlrzQhoxjiXGDLD68fCrDEiNovNdAH_18Z7IGE7de3U3UEKFjKMh9-P5ko-mEF4DxeQpqPXGnjulAq1Ffl2166G-0x9mWDrT6QJ348cxhenjh6_pUcjy9FzXO3tCjAyYjK5W2DITfdKI6tY1BCtHXIm-WfKY_e0hEo0w_wyu9a6tE4GyrhqzSulTrKVL-MB7lkGuoE72BFbQujbi'" alt="Service Photo" class="w-full h-full object-cover">
        </div>
        <button type="button" (click)="fileInput.click()" class="absolute bottom-0 right-0 bg-primary text-on-primary w-10 h-10 rounded-full flex items-center justify-center soft-shadow border-2 border-surface transition-transform active:scale-95">
          <span class="material-symbols-outlined text-md">photo_camera</span>
        </button>
      </div>
      <p (click)="fileInput.click()" class="mt-4 font-label-bold text-label-bold text-primary cursor-pointer hover:underline">Cambiar foto</p>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-lg" novalidate>
      
      <!-- Service Name -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant" for="service-name">Nombre del Servicio</label>
        <input
          class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md"
          id="service-name"
          placeholder="Ej. Corte de pelo premium"
          type="text"
          name="name"
          [(ngModel)]="name"
        />
      </div>

      <!-- Category Selector -->
      <div class="space-y-xs mb-md">
        <label class="font-label-bold text-label-bold text-on-surface-variant" for="category-select">Categoría</label>
        <div class="relative">
          <select
            class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md cursor-pointer"
            id="category-select"
            name="categoryDropdown"
            [(ngModel)]="selectedCategoryDropdown"
            (change)="addCategory(selectedCategoryDropdown)"
          >
            <option value="" disabled selected>Selecciona una categoría</option>
            @for (cat of availableCategories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
        </div>

        <!-- Selected Tags -->
        <div class="flex flex-wrap gap-sm mt-sm">
          @for (tag of selectedCategories(); track tag) {
            <div class="flex items-center gap-xs bg-primary text-on-primary px-md py-1 rounded-full shadow-sm">
              <span class="text-body-sm font-medium">{{ tag }}</span>
              <button type="button" (click)="removeCategory(tag)" class="flex items-center justify-center hover:bg-white/20 rounded-full transition-colors p-0.5">
                <span class="material-symbols-outlined text-[16px] text-white">close</span>
              </button>
            </div>
          }
        </div>
      </div>

      <!-- Duration Picker -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant">Duración</label>
        <div class="grid grid-cols-2 gap-md">
          <div class="relative flex items-center">
            <input
              class="w-full h-11 bg-surface border border-[#e2e8f0] rounded-lg pl-md pr-xl focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md"
              min="0"
              placeholder="0"
              type="number"
              name="hours"
              [(ngModel)]="hours"
            />
            <span class="absolute right-md text-caption text-outline pointer-events-none">Horas</span>
          </div>
          <div class="relative flex items-center">
            <input
              class="w-full h-11 bg-surface border border-[#e2e8f0] rounded-lg pl-md pr-xl focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md"
              max="59"
              min="0"
              placeholder="30"
              type="number"
              name="minutes"
              [(ngModel)]="minutes"
            />
            <span class="absolute right-md text-caption text-outline pointer-events-none">Min</span>
          </div>
        </div>
      </div>

      <!-- Price Input -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant" for="price-input">Precio</label>
        <div class="relative flex items-center">
          <span class="absolute left-md text-on-surface-variant font-label-bold pointer-events-none">$</span>
          <input
            class="w-full h-11 bg-surface border border-[#e2e8f0] rounded-lg pl-xl pr-md focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md"
            id="price-input"
            placeholder="0.00"
            step="0.01"
            type="number"
            name="price"
            [(ngModel)]="price"
          />
        </div>
      </div>

      <!-- Description Textarea -->
      <div class="space-y-xs">
        <label class="font-label-bold text-label-bold text-on-surface-variant" for="desc-textarea">Breve Descripción</label>
        <textarea
          class="w-full bg-surface border border-[#e2e8f0] rounded-lg px-md py-sm focus:border-primary focus:ring-4 focus:ring-primary/10 transition-all outline-none text-body-md resize-none"
          id="desc-textarea"
          placeholder="Describe los detalles del servicio..."
          rows="4"
          name="description"
          [(ngModel)]="description"
        ></textarea>
      </div>

      <!-- Availability Toggle -->
      <div class="bg-surface-container-low rounded-xl p-4 flex items-center justify-between border border-outline-variant/20">
        <div>
          <h3 class="font-label-bold text-label-bold text-on-surface">Servicio Activo</h3>
          <p class="font-caption text-caption text-on-surface-variant">Disponible para reservas online</p>
        </div>
        <button
          type="button"
          (click)="toggleActive()"
          [class]="isActive() ? 'bg-primary justify-end' : 'bg-slate-300 justify-start'"
          class="w-12 h-6 rounded-full relative flex items-center transition-all p-1 duration-200 cursor-pointer"
        >
          <div class="w-4 h-4 bg-white rounded-full shadow-sm"></div>
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="mt-xl flex flex-col gap-md pt-sm">
        <button
          type="submit"
          style="background: linear-gradient(180deg, #0e9488 0%, #005049 100%) !important; color: white !important;"
          class="w-full py-md rounded-xl text-on-primary font-label-bold text-label-bold soft-shadow transition-all active:scale-95 h-12 flex items-center justify-center disabled:opacity-50"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full mr-2"></span>
            Guardando...
          } @else {
            Guardar Cambios
          }
        </button>
        
        <button
          type="button"
          (click)="goBack()"
          class="w-full py-md rounded-xl bg-surface border border-[#e2e8f0] text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-container-low transition-all active:scale-95 h-12 flex items-center justify-center"
        >
          Cancelar
        </button>

        <!-- Delete Button -->
        <div class="pt-4 border-t border-outline-variant/20 w-full">
          <button
            type="button"
            (click)="onDelete()"
            [disabled]="deleting()"
            class="w-full h-12 bg-transparent text-red-600 hover:bg-red-50 border border-red-200 font-label-bold text-label-bold rounded-xl flex items-center justify-center gap-sm active:scale-95 transition-all disabled:opacity-50"
          >
            @if (deleting()) {
              <span class="animate-spin h-5 w-5 border-2 border-red-600 border-t-transparent rounded-full mr-2"></span>
              Eliminando...
            } @else {
              <span class="material-symbols-outlined text-[20px]">delete</span>
              Eliminar Servicio
            }
          </button>
        </div>

      </div>

    </form>
  </div>
</main>
