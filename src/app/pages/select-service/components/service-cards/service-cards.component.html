<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 mt-4">
    @for (service of services; track service.id) {
    <div class="flex flex-col border border-gray-400 rounded-lg p-4 space-y-2">
        <h3 class="text-lg font-semibold">{{ service.name }}</h3>
        <p class="text-gray-600">{{ service.description }}</p>
        <div class="flex items-center justify-between">
            <p class="flex items-center gap-1">
                <ng-icon name="heroClock" class="text-blue-500 shrink-0"></ng-icon>
                {{ service.duration }}
            </p>
            <p class="text-primary font-semibold">${{ service.price }}</p>
        </div>

    </div>
    }
</div>
